name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SIGNING_CONFIGURED: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 != '' && secrets.ANDROID_APP_KEYSTORE_PASSWORD != '' && secrets.ANDROID_APP_KEY_ALIAS != '' && secrets.ANDROID_APP_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare offline GRLS catalog
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python scripts/build-grls-catalog.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Medication schedule tests
        run: node --experimental-strip-types --test src/lib/meditrack/engine.test.ts scripts/sign-out-plan.test.mjs

      - name: Build mobile web app
        run: npm run build:mobile

      - name: Copy GRLS catalog into Capacitor web assets
        run: |
          mkdir -p dist/client
          cp public/grls-catalog.json dist/client/grls-catalog.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare release signing key
        if: env.SIGNING_CONFIGURED == 'true' && github.event_name != 'pull_request'
        run: |
          echo "$ANDROID_APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meditrack-app-signing.jks"
          echo "ANDROID_APP_KEYSTORE_PATH=$RUNNER_TEMP/meditrack-app-signing.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: env.SIGNING_CONFIGURED == 'true' && github.event_name != 'pull_request'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meditrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: env.SIGNING_CONFIGURED == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: meditrack-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
