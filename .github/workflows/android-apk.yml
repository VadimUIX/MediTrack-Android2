name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare offline GRLS catalog
        run: |
          python -m pip install --disable-pip-version-check openpyxl
          python scripts/build-grls-catalog.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Medication schedule tests
        run: node --experimental-strip-types --test src/lib/meditrack/engine.test.ts scripts/sign-out-plan.test.mjs

      - name: Build mobile web app
        run: npm run build:mobile

      - name: Copy GRLS catalog into Capacitor web assets
        run: |
          mkdir -p dist/client
          cp public/grls-catalog.json dist/client/grls-catalog.json

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Check release signing configuration
        id: signing_check
        run: |
          if [ -n "$ANDROID_APP_KEYSTORE_BASE64" ] && [ -n "$ANDROID_APP_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_APP_KEY_ALIAS" ] && [ -n "$ANDROID_APP_KEY_PASSWORD" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
          ANDROID_APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}

      - name: Require release signing configuration
        if: github.event_name != 'pull_request'
        run: |
          if [ "$SIGNING_CONFIGURED" != "true" ]; then
            echo "::error::Release signing secrets are missing. Refusing to publish an unsigned or debug APK."
            exit 1
          fi
        env:
          SIGNING_CONFIGURED: ${{ steps.signing_check.outputs.configured }}

      - name: Prepare release signing key
        if: steps.signing_check.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: |
          echo "$ANDROID_APP_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meditrack-app-signing.jks"
          echo "ANDROID_APP_KEYSTORE_PATH=$RUNNER_TEMP/meditrack-app-signing.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}

      - name: Build signed release APK
        if: steps.signing_check.outputs.configured == 'true' && github.event_name != 'pull_request'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_APP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}

      - name: Prepare release APK filename
        if: steps.signing_check.outputs.configured == 'true' && github.event_name != 'pull_request'
        id: prepare_release_apk
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          VERSION_NAME=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/.*versionCode \([0-9][0-9]*\).*/\1/p' android/app/build.gradle | head -n 1)
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          APK_NAME="MediTrack-v${VERSION_NAME}-${VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        if: steps.signing_check.outputs.configured == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: MediTrack-v${{ steps.prepare_release_apk.outputs.version_name }}-${{ steps.prepare_release_apk.outputs.version_code }}
          path: android/app/build/outputs/apk/release/${{ steps.prepare_release_apk.outputs.apk_name }}
          if-no-files-found: error
